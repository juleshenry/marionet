<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marionet — VRM sign compiler</title>
    <style>
      :root {
        --bg-top: #10141c;
        --bg-bottom: #1c2433;
        --panel: rgba(12, 16, 24, 0.82);
        --text: #efe7d6;
        --muted: #b7ae9a;
        --line: rgba(239, 231, 214, 0.14);
        --accent: #e0a45a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
        color: var(--text);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        width: min(360px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        backdrop-filter: blur(8px);
        overflow: auto;
      }

      #hud.drop-target {
        outline: 2px dashed var(--accent);
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.04em;
      }

      .lede,
      #status,
      #gloss {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      #alphabet {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }

      .key {
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .key:hover,
      .key.active {
        border-color: var(--accent);
        color: var(--accent);
      }

      #replay,
      #reset-avatar,
      button.ghost {
        align-self: start;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }

      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      #search,
      #language {
        flex: 1;
        min-width: 0;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.28);
        color: var(--text);
        font: inherit;
      }

      #language {
        flex: 0 0 42%;
      }

      #results {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 18vh;
        overflow: auto;
      }

      .hit {
        text-align: left;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .hit.active,
      .hit:hover {
        border-color: var(--accent);
      }

      .hit .meta {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }

      #badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
      }

      #badge.ready {
        color: var(--accent);
        border-color: var(--accent);
      }

      #inspector {
        margin: 0;
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
      }

      #inspector b {
        color: var(--text);
        font-weight: 400;
      }

      label.ctrl {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }

      #speed {
        width: 88px;
      }

      #signdesc {
        margin: 0;
        padding: 10px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.28);
        color: #d7cbb3;
        font: 11px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
        white-space: pre-wrap;
        overflow: auto;
        max-height: 22vh;
      }

      body.demo #hud {
        display: none;
      }

      #caption {
        display: none;
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 12px;
        background: rgba(12, 16, 24, 0.78);
        color: var(--text);
        font-size: 18px;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      body.demo #caption {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <aside id="hud">
      <h1>marionet</h1>
      <p class="lede">Polyglot citation dictionary. One sign is one lemma — English word count is not the parse. Drop a .vrm or a .json clip. Type A–Z to fingerspell.</p>
      <p id="status">marionet / loading…</p>
      <div class="row">
        <input id="search" type="search" placeholder="search gloss or spoken word" autocomplete="off" />
        <select id="language" aria-label="sign language">
          <option value="all">all languages</option>
        </select>
      </div>
      <div id="results"></div>
      <p id="gloss">—</p>
      <span id="badge">—</span>
      <p id="inspector"></p>
      <div id="alphabet"></div>
      <div class="row">
        <button id="replay" type="button">replay</button>
        <label class="ctrl"><input id="mirror" type="checkbox" /> mirror</label>
        <label class="ctrl">speed <input id="speed" type="range" min="0.25" max="1.5" step="0.25" value="1" /></label>
        <button id="reset-avatar" class="ghost" type="button">sample avatar</button>
      </div>
      <pre id="signdesc">{}</pre>
    </aside>
    <div id="caption"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.js"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
