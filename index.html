<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marionet — VRM sign compiler</title>
    <style>
      :root {
        --bg-top: #10141c;
        --bg-bottom: #1c2433;
        --panel: rgba(12, 16, 24, 0.82);
        --text: #efe7d6;
        --muted: #b7ae9a;
        --line: rgba(239, 231, 214, 0.14);
        --accent: #e0a45a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
        color: var(--text);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        width: min(360px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        backdrop-filter: blur(8px);
        overflow: auto;
      }

      #hud.drop-target {
        outline: 2px dashed var(--accent);
      }

      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.04em;
      }

      .lede,
      #status,
      #gloss {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      #alphabet {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }

      .key {
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .key:hover,
      .key.active {
        border-color: var(--accent);
        color: var(--accent);
      }

      #replay {
        align-self: start;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }

      #signdesc {
        margin: 0;
        padding: 10px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.28);
        color: #d7cbb3;
        font: 11px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
        white-space: pre-wrap;
        overflow: auto;
        max-height: 42vh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <aside id="hud">
      <h1>marionet</h1>
      <p class="lede">Phonology → VRM gesture code. Type A–Z or drop a custom .vrm.</p>
      <p id="status">marionet / loading…</p>
      <p id="gloss">—</p>
      <div id="alphabet"></div>
      <button id="replay" type="button">replay</button>
      <pre id="signdesc">{}</pre>
    </aside>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.js"
        }
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
