<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marionet - VRM Hello World</title>
    <style>
      :root {
        --bg-top: #0f172a;
        --bg-bottom: #1f2937;
        --text: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
        color: var(--text);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      .label {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(6px);
        font-size: 14px;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="label" id="status">marionet / loading avatar...</div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.js"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { VRMLoaderPlugin } from "@pixiv/three-vrm";

      const app = document.querySelector("#app");
      const status = document.querySelector("#status");

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      app.append(renderer.domElement);

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.45, 2.6);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.25, 0);
      controls.enablePan = false;
      controls.enableDamping = true;
      controls.minDistance = 1.3;
      controls.maxDistance = 4;

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x243047, 1.25);
      hemiLight.position.set(0, 2, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
      dirLight.position.set(1.2, 2.4, 2.2);
      scene.add(dirLight);

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(2.8, 64),
        new THREE.MeshStandardMaterial({ color: 0x0b1020, transparent: true, opacity: 0.7 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.01;
      scene.add(floor);

      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));

      const modelUrl =
        "https://cdn.jsdelivr.net/gh/pixiv/three-vrm@release/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm";

      let vrm;

      loader.load(
        modelUrl,
        (gltf) => {
          vrm = gltf.userData.vrm;
          vrm.scene.rotation.y = Math.PI;
          scene.add(vrm.scene);
          status.textContent = "marionet / avatar loaded";
        },
        undefined,
        (error) => {
          console.error("Failed to load VRM model", error);
          status.textContent = "marionet / failed to load avatar";
        }
      );

      const clock = new THREE.Clock();
      const animate = () => {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        if (vrm) {
          vrm.update(delta);
          vrm.scene.rotation.y += Math.sin(clock.elapsedTime * 0.6) * 0.0008;
        }

        controls.update();
        renderer.render(scene, camera);
      };

      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
