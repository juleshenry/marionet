<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>three-vrm Safe Hello World</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #333333; /* Lighter background so you can see it working */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: sans-serif;
            font-size: 18px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 5px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loading">Loading VRM Model...</div>

    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
          "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        // --- 1. Basic Three.js Setup ---
        const scene = new THREE.Scene();
        
        // Add a grid helper so you can see the 3D space immediately even if loading fails
        const gridHelper = new THREE.GridHelper(10, 10);
        scene.add(gridHelper);

        const camera = new THREE.PerspectiveCamera(30.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
        camera.position.set(0.0, 1.4, 1.4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0.0, 1.3, 0.0);
        controls.update();

        // --- 2. Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, Math.PI);
        directionalLight.position.set(1.0, 1.0, 1.0).normalize();
        scene.add(directionalLight);

        // --- 3. Load VRM Model ---
        let currentVrm = null;
        const loader = new GLTFLoader();

        loader.register((parser) => {
            return new VRMLoaderPlugin(parser);
        });

        // Official test VRM asset URL
        const vrmUrl = 'https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm';

        loader.load(
            vrmUrl,
            (gltf) => {
                const vrm = gltf.userData.vrm;
                currentVrm = vrm;

                scene.add(vrm.scene);
                VRMUtils.rotateVRM0(vrm); 

                document.getElementById('loading').innerText = 'VRM Loaded Successfully! Use mouse to rotate.';
                console.log('VRM Loaded:', vrm);
            },
            (progress) => {
                const percentage = Math.round((progress.loaded / progress.total) * 100);
                document.getElementById('loading').innerText = `Loading: ${percentage}%`;
            },
            (error) => {
                document.getElementById('loading').style.color = '#ff4444';
                document.getElementById('loading').innerText = 'Error loading VRM. Check browser console (F12).';
                console.error(error);
            }
        );

        // --- 4. Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta();

            // Safe update loop: only calls update if the instance actually exists
            if (currentVrm) {
                currentVrm.update(deltaTime);
            }

            renderer.render(scene, camera);
        }

        animate();

        // --- 5. Handle Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
