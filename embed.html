<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marionet player</title>
    <style>
      :root {
        --bg: #f3efe6;
        --text: #1d2230;
        --muted: #5c6272;
        --panel: rgba(255, 255, 255, 0.86);
        --line: rgba(29, 34, 48, 0.14);
        --accent: #b8692a;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #141923;
          --text: #efe7d6;
          --muted: #b7ae9a;
          --panel: rgba(12, 16, 24, 0.82);
          --line: rgba(239, 231, 214, 0.16);
          --accent: #e0a45a;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
        touch-action: none;
      }

      #stage canvas {
        position: absolute;
        inset: 0;
        display: block;
      }

      #status {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: calc(100% - 32px);
        padding: 8px 12px;
        border-radius: 10px;
        background: var(--panel);
        color: var(--muted);
        text-align: center;
      }

      #status:empty {
        display: none;
      }

      /* One row, even in a phone-sized frame: the stage keeps the height. */
      #bar {
        margin: 0 6px 6px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        backdrop-filter: blur(8px);
      }

      button,
      select {
        min-height: 32px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font: inherit;
      }

      button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 600;
      }

      select {
        flex: 1 1 auto;
        min-width: 0;
        max-width: 11em;
      }

      #replay {
        font-size: 16px;
      }

      .speeds {
        display: flex;
        gap: 4px;
      }

      #file {
        display: none;
      }

      /* The viewer's own avatars, over the stage, to rename or remove. */
      #mine {
        position: absolute;
        inset: 6px 6px 52px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        backdrop-filter: blur(8px);
      }

      #mine[hidden] {
        display: none;
      }

      #mine .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      #mine .note {
        margin: 0;
        color: var(--muted);
      }

      #mine-list {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      #mine-list li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      #mine-list input {
        flex: 1 1 8em;
        min-width: 0;
        min-height: 32px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font: inherit;
      }

      #mine-list small {
        flex-basis: 100%;
        color: var(--muted);
      }

      #mine-add {
        align-self: flex-start;
      }
    </style>
  </head>
  <body>
    <div id="stage" aria-label="3D signing avatar"></div>
    <p id="status">Loading avatar…</p>
    <section id="mine" hidden aria-label="Your avatars">
      <div class="head">
        <strong>Your avatars</strong>
        <button id="mine-done" type="button">Done</button>
      </div>
      <p class="note">Kept in this browser only. They are never uploaded.</p>
      <ul id="mine-list"></ul>
      <button id="mine-add" type="button">Add a .vrm…</button>
    </section>
    <div id="bar">
      <select id="avatar" aria-label="Avatar"></select>
      <div class="speeds" role="group" aria-label="Speed">
        <button type="button" data-speed="0.25" aria-pressed="false">¼×</button>
        <button type="button" data-speed="0.5" aria-pressed="false">½×</button>
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
      </div>
      <button id="replay" type="button" aria-label="Replay" title="Replay">↻</button>
      <input id="file" type="file" accept=".vrm" />
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.js"
        }
      }
    </script>
    <script type="module" src="./src/embed.js"></script>
  </body>
</html>
